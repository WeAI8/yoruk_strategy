services:
  game-db:
    image: postgres:16-alpine
    container_name: yoruk_strategy_db
    restart: always
    environment:
      POSTGRES_DB: ${STRATEGY_DB_NAME:-yoruk_strategy_db}
      POSTGRES_USER: ${STRATEGY_DB_USER:-strategy_admin}
      POSTGRES_PASSWORD: ${STRATEGY_DB_PASSWORD:-strategy_secret_password}
    ports:
      - "127.0.0.1:${STRATEGY_DB_PORT:-5433}:5432"
    volumes:
      - strategy_db_data:/var/lib/postgresql/data
    networks:
      - yoruk_strategy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STRATEGY_DB_USER:-strategy_admin} -d ${STRATEGY_DB_NAME:-yoruk_strategy_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-redis:
    image: redis:7-alpine
    container_name: yoruk_strategy_redis
    restart: always
    ports:
      - "127.0.0.1:${STRATEGY_REDIS_PORT:-6380}:6379"
    networks:
      - yoruk_strategy_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  game-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: yoruk_strategy_server
    restart: always
    ports:
      - "127.0.0.1:${GAME_SERVER_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8081
      DATABASE_URL: postgres://${STRATEGY_DB_USER:-strategy_admin}:${STRATEGY_DB_PASSWORD:-strategy_secret_password}@game-db:5432/${STRATEGY_DB_NAME:-yoruk_strategy_db}
      REDIS_URL: redis://game-redis:6379
      PLATFORM_AUTH_URL: ${PLATFORM_AUTH_URL:-http://host.docker.internal:8080/api/v1/auth/exchange-ticket}
      CLIENT_ID: ${CLIENT_ID:-game-client-strategy-01}
      CLIENT_SECRET: ${CLIENT_SECRET:-yoruk_strategy_secret_key}
      ALLOW_DEV_TICKETS: ${ALLOW_DEV_TICKETS:-true}
    depends_on:
      game-db:
        condition: service_healthy
      game-redis:
        condition: service_healthy
    networks:
      - yoruk_strategy_net

  game-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: yoruk_strategy_client
    restart: always
    ports:
      - "127.0.0.1:${GAME_CLIENT_PORT:-3001}:80"
    depends_on:
      - game-server
    networks:
      - yoruk_strategy_net

networks:
  yoruk_strategy_net:
    driver: bridge

volumes:
  strategy_db_data:
