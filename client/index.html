<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yörük Strategy: Kadim Bozkır</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: 'Inter', sans-serif;
      color: #e6edf3;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
    }
    canvas#gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    /* ÜST KAYNAK VE MEVSİM BARI */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(13, 17, 23, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 30px;
      padding: 8px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }
    .res-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    .res-icon {
      font-size: 16px;
    }
    .res-val {
      color: #f0e6d2;
      font-family: 'Cinzel', serif;
    }
    .season-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #2d3748, #1a202c);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 700;
      font-size: 13px;
      color: #ecc94b;
      letter-spacing: 1px;
    }

    /* PERFORMANS VE STATÜ BİLGİSİ */
    .perf-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #48bb78;
      font-family: monospace;
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    /* ALT KONTROL VE ASKERİ PANEL */
    .bottom-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 16px;
      padding: 12px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 10;
    }
    .action-btn {
      background: #1f2937;
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #f7fafc;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      min-width: 90px;
    }
    .action-btn:hover {
      background: #374151;
      border-color: #d4af37;
      transform: translateY(-2px);
    }
    .action-btn.turan {
      background: linear-gradient(135deg, #742a2a, #9b2c2c);
      border-color: #f56565;
      color: #fff;
    }
    .action-btn.turan:hover {
      background: linear-gradient(135deg, #9b2c2c, #c53030);
      box-shadow: 0 0 14px rgba(229, 62, 62, 0.5);
    }
    .action-cost {
      font-size: 10px;
      color: #a0aec0;
      font-weight: 400;
    }

    /* SOL ÜST OBA KÜNYESİ */
    .camp-info {
      position: absolute;
      top: 14px;
      left: 16px;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 10px 16px;
      border-radius: 12px;
      z-index: 10;
    }
    .camp-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: #d4af37;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .camp-details {
      font-size: 12px;
      color: #a0aec0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* SAĞ BİLDİRİM VE SAVAŞ GÜNLÜĞÜ */
    .battle-log {
      position: absolute;
      bottom: 20px;
      right: 16px;
      width: 280px;
      max-height: 180px;
      overflow-y: auto;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      font-size: 11px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-item {
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e0;
    }
    .log-item.turan-alert {
      background: rgba(197, 48, 48, 0.25);
      color: #feb2b2;
      border-left: 3px solid #f56565;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- OBA KÜNYESİ -->
    <div class="camp-info">
      <div class="camp-title" id="campName">Kadim Bozkır Otağı</div>
      <div class="camp-details">
        <span id="playerUser">Kağan: Bağlanıyor...</span>
        <span id="campCoords">Konum: (--, --)</span>
        <span id="campMorale">Moral: %100</span>
      </div>
    </div>

    <!-- ÜST KAYNAK VE MEVSİM BARI -->
    <div class="top-bar">
      <div class="res-item" title="Tulpar Soyu Atlar">
        <span class="res-icon">🐎</span>
        <span class="res-val" id="resHorse">0</span>
      </div>
      <div class="res-item" title="Tahıl & Et (Oba İaşesi)">
        <span class="res-icon">🌾</span>
        <span class="res-val" id="resFood">0</span>
      </div>
      <div class="res-item" title="Demir (Kılıç & Zırh)">
        <span class="res-icon">⛏️</span>
        <span class="res-val" id="resIron">0</span>
      </div>
      <div class="res-item" title="Keçe & Deri (Otağ & Yay)">
        <span class="res-icon">⛺</span>
        <span class="res-val" id="resLeather">0</span>
      </div>
      <div class="res-item" title="Altın (Kurultay & Ticaret)">
        <span class="res-icon">🪙</span>
        <span class="res-val" id="resGold">0</span>
      </div>

      <div class="season-badge" id="seasonBadge">
        <span id="seasonIcon">🌿</span>
        <span id="seasonText">BAHAR</span>
      </div>
    </div>

    <!-- PERFORMANS METRİKLERİ -->
    <div class="perf-badge">
      <span id="fpsCounter">FPS: 60</span>
      <span id="drawCallCounter">DrawCalls: 1</span>
    </div>

    <!-- SAVAŞ VE HADİSE GÜNLÜĞÜ -->
    <div class="battle-log" id="battleLog">
      <div class="log-item">Bozkır simülasyonu başlatıldı.</div>
    </div>

    <!-- ALT AKSİYON VE BİRLİK PANELİ -->
    <div class="bottom-panel">
      <button class="action-btn" id="btnTrainAkinci">
        <span>🏹 Akıncı</span>
        <span class="action-cost">2 At, 10 Aş, 5 Dem</span>
      </button>
      <button class="action-btn" id="btnTrainAlp">
        <span>🗡️ Alp</span>
        <span class="action-cost">1 At, 12 Aş, 15 Dem</span>
      </button>
      <button class="action-btn" id="btnTrainCeri">
        <span>🛡️ Piyade</span>
        <span class="action-cost">8 Aş, 8 Dem, 10 Keç</span>
      </button>
      <button class="action-btn" id="btnTrainAlpagut">
        <span>👑 Alpagut</span>
        <span class="action-cost">2 At, 20 Aş, 25 Dem</span>
      </button>
      <button class="action-btn" id="btnMigrate">
        <span>⛺ Göç Et</span>
        <span class="action-cost">Yaylak / Kışlak</span>
      </button>
      <button class="action-btn turan" id="btnTuran">
        <span>⚔️ TURAN</span>
        <span class="action-cost">Sahte Ricat & Hilal</span>
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
